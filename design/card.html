<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: "Instrument Sans";
      src: url("../site/node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2") format("woff2");
      font-weight: 400 700;
    }
    @font-face {
      font-family: "Fraunces";
      src: url("../site/public/fonts/fraunces-latin-full-italic.woff2") format("woff2");
      font-weight: 100 900;
      font-style: italic;
    }

    :root { --bg: #f3eee4; --ink: #1b1916; --ink-2: #6b645a; --rule: #d8d0c2; }
    [data-theme="dark"] { --bg: #17140f; --ink: #ece6da; --ink-2: #9c9384; --rule: #332e26; }

    html, body { margin: 0; height: 100%; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Instrument Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      padding: var(--pad);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .top, .bottom {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--small);
      color: var(--ink-2);
    }
    .top { top: var(--pad); }
    .bottom { bottom: var(--pad); }
    .brand { display: flex; align-items: center; gap: 0.55em; color: var(--ink); font-weight: 550; }
    .brand img { width: var(--avatar); height: var(--avatar); border-radius: 50%; }
    h1 { margin: 0; font-size: var(--big); font-weight: 600; letter-spacing: -0.025em; line-height: 1.05; }
    .line {
      margin: 0.45em 0 0;
      max-width: var(--measure);
      font-size: var(--mid);
      font-weight: 450;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--ink-2);
    }
    .line em {
      font-family: "Fraunces", serif;
      font-style: italic;
      font-weight: 450;
      font-size: 1.08em;
      color: var(--ink);
      font-variation-settings: "SOFT" 50, "WONK" 1;
    }
    .marks { display: flex; gap: 1.5em; }
    .mark { display: flex; align-items: center; gap: 0.4em; color: var(--ink); font-weight: 550; }
    .mark img { width: 1.15em; height: 1.15em; border-radius: 0.25em; }

    .og { --pad: 72px; --avatar: 44px; --small: 22px; --big: 80px; --mid: 36px; --measure: 920px; }
    .banner { --pad: 44px; --avatar: 30px; --small: 15px; --big: 50px; --mid: 23px; --measure: 600px; }
    .banner .bottom { display: none; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <span class="brand"><img src="../site/public/avatar.jpg" alt="">schlossers.at</span>
      <span>Softwareentwicklung · Wien</span>
    </div>
    <h1>Sebastian Schlosser</h1>
    <p class="line">Werkzeuge für Teams, Vereine und für mich selbst. Die meisten, <em>weil eines gefehlt hat.</em></p>
    <div class="bottom">
      <span class="marks">
        <span class="mark"><img src="../site/public/marken/clunema.png" alt="">Clunema</span>
        <span class="mark"><img src="../site/public/marken/playbook.svg" alt="">Playbook</span>
        <span class="mark"><img src="../site/public/marken/vnc-beach.png" alt="">VNC Beach</span>
      </span>
      <span>github.com/realS3BI</span>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("card").classList.add(params.get("kind") || "og");
    if (params.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
  </script>
</body>
</html>
