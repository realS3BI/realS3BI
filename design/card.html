<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../site/assets/style.css">
  <style>
    html, body { margin: 0; height: 100%; }
    body { overflow: hidden; }
    .card {
      position: relative;
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      padding: 0 var(--pad);
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--paper);
    }
    .card h1 {
      margin: 0;
      font-size: var(--size);
      font-weight: 360;
      font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
      line-height: 0.92;
      letter-spacing: -0.035em;
    }
    .card h1 em { font-style: italic; font-weight: 300; }
    .top, .bottom {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: var(--mono);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .top { top: var(--edge); }
    .bottom { bottom: var(--edge); }
    .top span:first-child { color: var(--ink); }
    .mark {
      display: inline-block;
      width: 0.7em;
      height: 0.7em;
      margin-right: 0.6em;
      background: var(--accent);
      vertical-align: -0.05em;
    }

    .og { --pad: 80px; --edge: 64px; --size: 132px; --mono: 22px; }
    .og h1 { margin-top: -10px; }
    .og .line { margin: 44px 0 0; max-width: 820px; font-size: 34px; line-height: 1.3; font-variation-settings: "opsz" 36, "SOFT" 50; }

    .banner { --pad: 56px; --edge: 40px; --size: 104px; --mono: 15px; flex-direction: row; align-items: flex-end; justify-content: space-between; padding-bottom: 52px; }
    .banner .line { margin: 0 0 10px; max-width: 430px; font-size: 25px; line-height: 1.32; font-variation-settings: "opsz" 36, "SOFT" 50; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="top"><span><i class="mark"></i>schlossers.at</span><span>Softwareentwicklung · Österreich</span></div>
    <h1>Sebastian<br><em>Schlosser</em></h1>
    <p class="line">Ich baue Werkzeuge für Teams, Vereine und für mich selbst.</p>
    <div class="bottom"><span>github.com/realS3BI</span><span>TypeScript · Rust · React</span></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const kind = params.get("kind") || "og";
    const card = document.getElementById("card");
    card.classList.add(kind);
    if (kind === "banner") {
      card.querySelector(".bottom").remove();
      card.querySelector(".top span:last-child").remove();
    }
  </script>
</body>
</html>
